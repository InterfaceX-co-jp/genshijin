name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify plugin.json version matches tag (push tag 時のみ)
        if: github.event_name == 'push'
        run: |
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('packages/skill-claude/.claude-plugin/plugin.json'))['version'])")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::plugin.json version ($MANIFEST_VERSION) はタグ ($TAG_VERSION) と不一致。リリース中止。"
            exit 1
          fi
          echo "✅ plugin.json version == tag == $TAG_VERSION"

      - name: Check existing benchmark result
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -f "benchmarks/results/${TAG}_ja.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ benchmarks/results/${TAG}_ja.json 既存 → ベンチスキップ"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install benchmark dependencies
        if: steps.check.outputs.exists != 'true'
        run: pip install -r benchmarks/requirements.txt

      - name: Run benchmark (ja)
        if: steps.check.outputs.exists != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cd benchmarks
          python run.py --lang ja --trials 3 --tag "$TAG" --update-readme --update-docs

      - name: Bust star-history cache in README
        if: steps.check.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import pathlib

          tag = os.environ["TAG"]
          readme = pathlib.Path("README.md")
          text = readme.read_text(encoding="utf-8")

          def replace(match):
              url = match.group(0)
              url = re.sub(r"&cb=[^\"&\s]*", "", url)
              return url + f"&cb={tag}"

          new_text = re.sub(
              r"https://api\.star-history\.com/chart\?[^\"\s]+",
              replace,
              text,
          )
          if new_text != text:
              readme.write_text(new_text, encoding="utf-8")
              print(f"README.md: star-history URL に cb={tag} を追加")
          else:
              print("README.md: star-history URL 見つからず。スキップ")
          PY

      - name: Commit benchmark results (先行push)
        if: steps.check.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/benchmark.json "benchmarks/results/${TAG}_ja.json"
          git diff --staged --quiet || git commit -m "ベンチマーク結果を更新 (${TAG}) [skip benchmark]"
          git pull --rebase origin main
          git push origin main

      - name: Upload benchmark artifact (再実行保険)
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ steps.version.outputs.tag }}
          path: benchmarks/results/${{ steps.version.outputs.tag }}_ja.json
          retention-days: 90
          if-no-files-found: warn

  release:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (post-bench)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check if release exists
        id: release-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.benchmark.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Release $TAG 既存 → スキップ"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download benchmark artifact (フォールバック)
        if: steps.release-check.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: benchmark-${{ needs.benchmark.outputs.tag }}
          path: benchmarks/results/

      - name: Build release notes
        if: steps.release-check.outputs.exists != 'true'
        id: notes
        env:
          TAG: ${{ needs.benchmark.outputs.tag }}
          VERSION: ${{ needs.benchmark.outputs.version }}
        run: |
          python3 - <<'PY' > release-notes.md
          import json
          import os
          import pathlib
          import re
          import sys

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]

          # CHANGELOG セクション抽出
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          m = re.search(pattern, text, flags=re.DOTALL | re.MULTILINE)
          if not m:
              sys.stderr.write(f"CHANGELOG.md に [{version}] セクションが見つからない。\n")
              sys.exit(1)
          changelog_section = m.group(1).strip()

          # ベンチマーク結果読込
          bench_path = pathlib.Path(f"benchmarks/results/{tag}_ja.json")
          bench_md = ""
          if bench_path.exists():
              data = json.loads(bench_path.read_text(encoding="utf-8"))
              results = data["results"]
              total_n = sum(r["median_normal"] for r in results)
              total_c = sum(r["median_caveman"] for r in results)
              total_g = sum(r["median_genshijin"] for r in results)
              saved_cv = round((1 - total_c / total_n) * 100)
              saved_gs = round((1 - total_g / total_n) * 100)
              vs_cv = round((1 - total_g / total_c) * 100) if total_c > 0 else 0
              repo = os.environ.get("GITHUB_REPOSITORY", "")
              link = f"https://github.com/{repo}/blob/main/benchmarks/results/{tag}_ja.json"
              bench_md = (
                  "\n\n## ベンチマーク結果 (ja, trials=3)\n\n"
                  f"- モデル: `{data['model']}`\n"
                  f"- 平均トークン削減: **genshijin {saved_gs}%** / caveman {saved_cv}%\n"
                  f"- genshijin vs caveman: **{vs_cv}%** 追加削減\n"
                  f"- 詳細JSON: [{tag}_ja.json]({link}) (Release assets にも添付)\n"
              )

          sys.stdout.write(changelog_section + bench_md + "\n")
          PY
          echo '--- release-notes.md ---'
          cat release-notes.md

      - name: Create GitHub Release
        if: steps.release-check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.benchmark.outputs.tag }}
        run: |
          ASSET=""
          if [ -f "benchmarks/results/${TAG}_ja.json" ]; then
            ASSET="benchmarks/results/${TAG}_ja.json"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            $ASSET
