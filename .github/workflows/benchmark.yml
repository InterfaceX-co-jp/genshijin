name: Run Benchmark

on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'Language to benchmark'
        type: choice
        options:
          - ja
          - en
          - both
        default: ja

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        lang: ${{ fromJSON(inputs.lang == 'both' && '["ja","en"]' || format('["{0}"]', inputs.lang)) }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r benchmarks/requirements.txt

      - name: Run benchmark (${{ matrix.lang }})
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd benchmarks
          python run.py --lang ${{ matrix.lang }} --trials 3 --update-readme --update-docs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/benchmark.json
          git diff --staged --quiet || git commit -m "ベンチマーク結果を更新 (${{ matrix.lang }}) [skip benchmark]"
          git pull --rebase
          git push
